[package]
name = "rasura"
description = "True PDF editing: read a document as paragraphs and blocks, edit it, write it back with the untouched bytes intact"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
rasura-cos.workspace = true
rasura-content.workspace = true
rasura-layout.workspace = true
rasura-font.workspace = true
rasura-edit.workspace = true
# The layout engine and composition. Spec 11's `create` needs it, and it is the
# reason the flow stack is no longer unreachable from the shipped SDK.
rasura-flow.workspace = true

[dev-dependencies]
# The fixture builder, for the examples and tests only.
rasura-cos.workspace = true
