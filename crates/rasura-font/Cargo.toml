[package]
name = "rasura-font"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Font parsing, metrics, shaping and glyph injection for Rasura"

[dependencies]
rasura-cos.workspace = true
# The shaper. A HarfBuzz port, like rustybuzz before it, but maintained and
# built on `read-fonts` rather than dragging in a second font parser.
harfrust = "0.13.0"
thiserror.workspace = true
unicode-script = "0.5.8"
# Needed for the /ToUnicode CMap parser, so an injection extends the existing
# mappings rather than replacing them. §8.7's Type 3 fonts will use it too:
# their glyph procedures are content streams.
rasura-content.workspace = true
