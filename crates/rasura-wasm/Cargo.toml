[package]
name = "rasura-wasm"
description = "The WASM surface for Rasura: a thin adapter over the facade crate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# `cdylib` for the wasm artefact, `rlib` so the crate's own tests can run on the
# host. Without the second, nothing here is testable without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
rasura = { path = "../rasura", version = "0.1.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# The object layer's fixture builder, for this crate's host-side tests only.
rasura-cos.workspace = true
