[package]
name = "rasura-wasm"
description = "The WASM surface for Rasura: a thin adapter over the facade crate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Not published, and now the manifest says so rather than RELEASING.md alone.
#
# This is a build artefact for the npm package, not a library anyone should
# depend on: publishing it would invite exactly that, and its `cdylib` is
# useless to a Rust caller. It has always been excluded by the release
# instructions naming six crates and not this one, which is a rule enforced by
# whoever is typing. The other six harness crates already carry this line.
publish = false

[lib]
# `cdylib` for the wasm artefact, `rlib` so the crate's own tests can run on the
# host. Without the second, nothing here is testable without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
rasura = { path = "../rasura", version = "0.1.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# The object layer's fixture builder, for this crate's host-side tests only.
rasura-cos.workspace = true
