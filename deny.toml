# Spec 4.3: licensing is a hard build gate. A violation fails CI.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"

# Every internal crate depends on its siblings by path, and a path dependency
# has no version requirement to check. Denying wildcards outright therefore
# fails on the workspace's own structure rather than on anything a third party
# published, which is the opposite of what the rule is for.
wildcards = "deny"
allow-wildcard-paths = true

# Spec 4.2: the no-C++ rule. None of these may enter the *shipped* graph.
deny = [
    # pdfium is the one exception the spec itself makes: "PDFium may be used as
    # a test-only reference renderer for the pixel-diff harness; it is never
    # shipped." `wrappers` states that precisely — banned everywhere except as a
    # dependency of that harness, so a stray `use` from a shipping crate still
    # fails the build.
    { name = "pdfium-render", wrappers = ["rasura-pixeldiff"] },
    { name = "mupdf" },
    { name = "poppler" },
    { name = "lopdf" },
    { name = "pdf" },
]

[advisories]
version = 2
yanked = "deny"

# Empty, and it should stay that way.
#
# It used to hold RUSTSEC-2026-0192 and -0206, the unmaintained notices against
# `ttf-parser` and `rustybuzz`, with a note saying no maintained pure-Rust
# replacement existed. That was wrong when it was written: harfrust is the
# rustybuzz author's own successor. The shaper moved and both entries stopped
# matching anything, which is how a suppression should end.
#
# An ignore that no longer matches is worse than no ignore at all: it suppresses
# nothing today and quietly suppresses whatever reuses the id tomorrow. Delete
# them when they stop matching rather than leaving them as history.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
