[[file]]
name = "adversarial-indirect-stream-length"
generated = true
quirks = ["indirect-length"]
expects_leniency = []
notes = "An indirect /Length that resolves is correct behaviour, not a leniency."

[[file]]
name = "adversarial-startxref-into-the-void"
generated = true
quirks = ["bad-startxref"]
expects_leniency = ["XrefReconstructed"]
notes = "Forces recovery mode, which in turn forces SaveMode::FullRewrite."

[[file]]
name = "adversarial-no-eof-marker"
generated = true
quirks = ["truncated", "no-xref"]
