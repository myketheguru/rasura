# Corpus manifest. Spec 14.1.
#
# Every file in `corpus/files/` gets an entry here recording producer, PDF
# version, encryption, tagging, font types, and known quirks. The manifest is
# the thing that makes a corpus useful: without it, a failure on
# `some-report.pdf` tells you nothing about *which* property broke.
#
# `corpus/files/` is git-lfs. The invariant runner notices when it is absent and
# says so rather than reporting green on a corpus it never read.
#
# Adding a file:
#   1. drop it in corpus/files/
#   2. add an entry below
#   3. cargo run -p rasura-invariants
#
# Licensing: only files that may be redistributed. Anything under a restrictive
# licence goes in a private corpus referenced by path, never committed.

[corpus]
version = 1
# Seed files are generated by the library itself and are not stored in git.
# Regenerate with: cargo run -p rasura-invariants -- --write-seed corpus/files
generated_by = "cargo run -p rasura-invariants -- --write-seed"

