# ---------------------------------------------------------------------------
# External corpora. Fetched by corpus/fetch.sh into corpus/external/, which is
# git-ignored: these are other people's files under other people's licences, so
# the repository records how to obtain them rather than redistributing them.
# ---------------------------------------------------------------------------

[[external]]
name = "pdfjs"
source = "https://github.com/mozilla/pdf.js"
path = "corpus/external/pdfjs/test/pdfs"
licence = "Apache-2.0"
files = 974
size_mb = 119
fetched = true
notes = """
Two decades of known-hard cases, each kept because it broke something. The most
valuable single corpus available. The 315 `.link` stubs in that directory are
files pdf.js deliberately does not redistribute; fetch.sh leaves them alone.

First run found four real defects (docs/phase-1-notes.md). Walking every page of
it through the content layer found a fifth, in Flate decoding, that had been live
through all of Phase 1 (docs/phase-2-notes.md). It also serves as the input to
the Phase 2 differential against pdf.js.
"""

[[external]]
name = "latex"
path = "corpus/external/latex"
producer = "pdflatex / xelatex / lualatex (MiKTeX)"
licence = "generated locally, no third-party content"
build = "corpus/latex/build.ps1"
fetched = true
notes = """
Thirteen documents spanning the font setups that differ in /ToUnicode
behaviour, not thirteen similar documents: Computer Modern, T1/cm-super, Latin
Modern, the \\usepackage{cmap} remedy, URW Times, microtype, OpenType via
fontspec on both Unicode engines, system fonts, and maths on both.

This is the corpus spec 18 Q1 needs. Every sample contains ligatures (fi, ffi),
an em dash, accented characters and curly quotes -- the exact characters whose
extraction breaks when /ToUnicode is missing.
"""

[[external]]
name = "chrome-print-to-pdf"
path = "corpus/external/chrome"
producer = "Chrome headless --print-to-pdf"
licence = "generated locally, no third-party content"
files = 3
fetched = true
notes = "Prose, a table, and a two-column layout. Regenerate with corpus/fetch.ps1."

