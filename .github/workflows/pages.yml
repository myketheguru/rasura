# Deploy the Rasura site to GitHub Pages.
#
# Two things live here: the documentation at `/`, and the demonstration editor
# at `/#/editor`. Both are one React application built by Vite, and the module
# it drives is the same WebAssembly artefact the size budget and the node
# harness are run against — built here rather than committed, so what deploys is
# what CI measured.
#
# Note what is *absent*: no COOP/COEP headers, because Pages cannot set them and
# the single-threaded build (§12.1) does not need them. A threaded build would
# require cross-origin isolation and could not be hosted here at all.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'demo/browser.mjs'
      - 'crates/rasura-wasm/**'
      - 'crates/rasura*/src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes a pending one but never
# cancels a run already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the WASM toolchain
        run: |
          cargo install wasm-bindgen-cli --locked
          npm i -g wasm-opt

      # The same script CI uses, so the module on the site is the module the
      # size budget was measured against.
      - name: Build the module
        run: ./crates/rasura-wasm/build.sh

      # The sample document is generated rather than committed for the reason
      # everything under corpus/ is: it is derived, and derived files in a tree
      # go stale without anyone noticing.
      - name: Write the sample document
        run: cargo run -p rasura-flow --example sample

      - name: Stage the module and the sample
        run: |
          mkdir -p web/public/wasm
          cp target/pkg/web/rasura_wasm.js web/public/wasm/
          cp target/pkg/web/rasura_wasm_bg.wasm web/public/wasm/
          cp demo/sample.pdf web/public/

      - name: Install
        run: npm ci
        working-directory: web

      # Spec 12.4's "no `any`" is a rule about what this project ships, and it
      # is worth nothing if the site documenting it is loose. Same setting.
      - name: Typecheck
        run: npx tsc -b --noEmit
        working-directory: web

      - name: Build
        # Pages serves from a subdirectory, so every asset URL has to be
        # relative to it. Passed in rather than written down, because the same
        # build has to work from a local preview at `/`.
        run: npx vite build
        working-directory: web
        env:
          RASURA_BASE: /rasura/

      # And then actually load it. Everything above this line once passed on a
      # page that had never started in a browser, so nothing deploys that has
      # not been watched compile the module and read a document. Chrome is
      # preinstalled on the runner.
      - name: The site starts in a real browser
        run: node demo/browser.mjs
        env:
          RASURA_DIST: web/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
